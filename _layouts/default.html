<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  {% if page.title and page.title != "Home" %}{% assign og_title = page.title %}{% else %}{% assign og_title = site.title %}{% endif %}
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  <meta property="og:description" content="{{ page.description }}">
  {% endif %}
  {% if page.image %}
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ page.image | absolute_url }}">
  {% else %}
  <meta name="twitter:card" content="summary">
  {% endif %}
  <meta name="twitter:title" content="{{ og_title }}">
  {% if page.description %}<meta name="twitter:description" content="{{ page.description }}">{% endif %}
  <style>
    body {
      font-family: Georgia, "Times New Roman", Times, serif;
      font-size: 16px;
      line-height: 1.5;
      color: #000;
      background-color: #fff;
      margin: 0;
      padding: 0;
    }
    table.layout {
      max-width: 450px;
      margin: 0;
      margin-left: 40px;
      margin-right: 15px;
      border: 0;
      border-collapse: collapse;
    }
    @media (max-width: 520px) {
      table.layout {
        margin-left: 15px;
      }
    }
    td { padding: 10px 0; }
    td.header {
      padding: 20px 0;
    }
    td.header a {
      text-decoration: none;
      color: #000;
    }
    td.footer {
      padding: 20px 0;
      font-size: 13px;
      color: #666;
    }
    a { color: #000; }
    a:visited { color: #000; }
    img { max-width: 100%; height: auto; }
    h1{
      font-size: 1.1em;
    }
    h2{
      font-size: 1em;
    }
    ul.post-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    ul.post-list li {
      margin: 6px 0;
    }
    .post-date {
      font-size: 13px;
      color: #666;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <table class="layout" cellpadding="0" cellspacing="0">
    <tr>
      <td class="header">
        <b><a href="/">{{ site.title }}</a></b>
      </td>
    </tr>
    <tr>
      <td class="content">
        {{ content }}
      </td>
    </tr>
    <tr>
      <td class="footer">
        <!-- &copy; {{ site.title }} Why is this necessary? -->
      </td>
    </tr>
  </table>
  <script data-goatcounter="https://nick2k5.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
